name: Sync Container Images from LinuxContainers

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish a new release even if upstream image builds are unchanged"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 22 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set release variables
        shell: bash
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          echo "RELEASE_NAME=Container Images Sync (${TIMESTAMP} UTC)" >> "$GITHUB_ENV"
          echo "TAG_NAME=LXC-${TIMESTAMP}" >> "$GITHUB_ENV"

      - name: Auto-discover and fetch latest stable/LTS images
        id: sync
        shell: bash
        env:
          REPO_NAME: ${{ github.repository }}
          FORCE_SYNC: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p ./publish

          python3 - << 'PYEOF'
          import datetime
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          SERVER = "https://images.linuxcontainers.org"
          REPO = os.environ["REPO_NAME"]
          TAG = os.environ["TAG_NAME"]
          FORCE_SYNC = os.environ.get("FORCE_SYNC", "false").lower() == "true"
          ARCHS = {"amd64", "arm64"}

          def fetch_text(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "OsMutation-Sync/2.1"})
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return resp.read().decode("utf-8", errors="replace")

          def discover_debian_releases():
              """Auto-discover official Debian oldstable & stable codenames (e.g. 12-bookworm, 13-trixie, future 14-forky)."""
              mapping = {}
              for suite in ("oldstable", "stable"):
                  try:
                      txt = fetch_text(f"https://deb.debian.org/debian/dists/{suite}/Release")
                      codename = re.search(r"^Codename:\s*(\S+)", txt, re.M)
                      version = re.search(r"^Version:\s*([0-9]+)", txt, re.M)
                      if codename and version:
                          mapping[codename.group(1).lower()] = version.group(1)
                  except Exception as e:
                      print(f"[warn] Failed to query Debian {suite}: {e}", file=sys.stderr)
              if not mapping:
                  mapping = {"bookworm": "12", "trixie": "13"}
              print("Discovered Debian stable/oldstable:", mapping)
              return mapping

          def discover_ubuntu_lts():
              """Auto-discover supported Ubuntu LTS codenames & versions (e.g. 22.04-jammy, 24.04-noble, 26.04-resolute, future 28.04+)."""
              mapping = {}
              try:
                  txt = fetch_text("https://changelogs.ubuntu.com/meta-release-lts")
                  for block in re.split(r"\n\s*\n", txt.strip()):
                      dist = re.search(r"^Dist:\s*(\S+)", block, re.M)
                      ver = re.search(r"^Version:\s*([0-9]+\.[0-9]+)", block, re.M)
                      sup = re.search(r"^Supported:\s*([01])", block, re.M)
                      if dist and ver and sup and sup.group(1) == "1":
                          mapping[dist.group(1).lower()] = ver.group(1)
              except Exception as e:
                  print(f"[warn] Failed to query Ubuntu meta-release-lts: {e}", file=sys.stderr)
              if not mapping:
                  mapping = {"jammy": "22.04", "noble": "24.04", "resolute": "26.04"}
              print("Discovered supported Ubuntu LTS:", mapping)
              return mapping

          debian_map = discover_debian_releases()
          ubuntu_map = discover_ubuntu_lts()

          index_text = fetch_text(f"{SERVER}/meta/1.0/index-system", timeout=30)
          matched = {}

          for line in index_text.splitlines():
              parts = line.strip().split(";")
              if len(parts) < 6:
                  continue
              distro, rel, arch, variant = parts[0].lower(), parts[1], parts[2].lower(), parts[3].lower()
              path = parts[-1].strip("/")
              if variant != "default" or arch not in ARCHS:
                  continue

              name = None
              if distro == "alpine" and re.match(r"^[0-9]+\.[0-9]+$", rel):
                  name = f"alpine-{rel}-{arch}"
              elif distro == "debian" and rel.lower() in debian_map:
                  ver = debian_map[rel.lower()]
                  name = f"debian-{ver}-{rel.lower()}-{arch}"
              elif distro == "ubuntu" and rel.lower() in ubuntu_map:
                  ver = ubuntu_map[rel.lower()]
                  name = f"ubuntu-{ver}-{rel.lower()}-{arch}"
              elif distro == "centos":
                  m = re.match(r"^([0-9]+)-stream$", rel, re.I)
                  if m and int(m.group(1)) >= 9:
                      name = f"centos-{m.group(1)}-stream-{arch}"
              elif distro in ("rockylinux", "almalinux"):
                  if re.match(r"^[0-9]+$", rel) and int(rel) >= 9:
                      name = f"{distro}-{rel}-{arch}"

              if name:
                  matched[name] = (arch, path)

          if not matched:
              print("Error: No matching images found in LinuxContainers index.", file=sys.stderr)
              sys.exit(1)

          def natural_key(s):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r"([0-9]+)", s)]

          sorted_names = sorted(matched.keys(), key=natural_key)

          # Check if upstream image build paths changed compared to existing images.json
          # Also force a keep-alive refresh if last sync is >= 45 days old (prevents GitHub 60-day schedule auto-disable)
          prev_paths = {}
          days_since_sync = 999
          if os.path.exists("images.json"):
              try:
                  with open("images.json", "r", encoding="utf-8") as f:
                      prev_data = json.load(f)
                  for item in prev_data.get("images", []):
                      if "name" in item and "src_path" in item:
                          prev_paths[item["name"]] = item["src_path"]
                  prev_ts = prev_data.get("synced_at", "")
                  if prev_ts:
                      dt = datetime.datetime.strptime(prev_ts, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
                      days_since_sync = (datetime.datetime.now(datetime.timezone.utc) - dt).days
              except Exception as e:
                  print(f"[warn] Could not read previous images.json: {e}", file=sys.stderr)

          curr_paths = {n: matched[n][1] for n in sorted_names}
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if not FORCE_SYNC and prev_paths and curr_paths == prev_paths and days_since_sync < 45:
              print(f"All {len(sorted_names)} upstream image builds are unchanged (last sync {days_since_sync}d ago). Skipping duplicate release.")
              if gh_out:
                  with open(gh_out, "a", encoding="utf-8") as f:
                      f.write("changed=false\n")
              sys.exit(0)

          print(f"=== Syncing {len(sorted_names)} images (force={FORCE_SYNC}, days_since_sync={days_since_sync}) ===")

          synced_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          release_notes = [
              "## Synced Container RootFS Images",
              "",
              f"- Source: `{SERVER}`",
              f"- Synced at: `{synced_at}`",
              f"- Auto-discovered Debian releases: `{', '.join(f'{v}-{k}' for k, v in sorted(debian_map.items(), key=lambda x: int(x[1])))}`",
              "",
              "### Included Images",
          ]

          sha_lines = []
          json_images = []
          failed_images = []

          for name in sorted_names:
              arch, rel_path = matched[name]
              src_url = f"{SERVER}/{rel_path}/rootfs.tar.xz"
              filename = f"{name}.tar.xz"
              out_path = os.path.join("publish", filename)
              print(f"Downloading {src_url} -> {out_path}", flush=True)
              try:
                  subprocess.run(
                      ["curl", "-fsSL", "--retry", "3", "--retry-delay", "5", "--max-time", "300", src_url, "-o", out_path],
                      check=True,
                  )
                  subprocess.run(["xz", "-t", out_path], check=True)
              except subprocess.CalledProcessError as e:
                  print(f"[warn] Failed to download/verify {name}: {e}", file=sys.stderr)
                  if os.path.exists(out_path):
                      os.remove(out_path)
                  failed_images.append(name)
                  continue

              h = hashlib.sha256()
              with open(out_path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              digest = h.hexdigest()
              size_bytes = os.path.getsize(out_path)
              size_mb = size_bytes / (1024 * 1024)

              sha_lines.append(f"{digest}  {filename}")
              release_notes.append(f"- `{filename}` ({size_mb:.1f} MiB)")
              json_images.append({
                  "name": name,
                  "arch": arch,
                  "url": f"https://github.com/{REPO}/releases/download/{TAG}/{filename}",
                  "sha256": digest,
                  "size": size_bytes,
                  "src_path": rel_path,
              })

          # Abort if too many images failed (>20% or 0 succeeded)
          if not json_images or len(failed_images) > max(2, len(sorted_names) // 5):
              print(f"Error: Too many image downloads failed ({len(failed_images)}/{len(sorted_names)}): {failed_images}", file=sys.stderr)
              sys.exit(1)

          if failed_images:
              release_notes.append("")
              release_notes.append("### Skipped (Temporary Upstream Errors)")
              for fn in failed_images:
                  release_notes.append(f"- `{fn}`")

          with open(os.path.join("publish", "SHA256SUMS.txt"), "w", encoding="utf-8") as f:
              f.write("\n".join(sha_lines) + "\n")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(release_notes) + "\n")

          # Write compact one-entry-per-line images.json so shell scripts can parse it without jq/python
          with open("images.json", "w", encoding="utf-8") as f:
              f.write("{\n")
              f.write(f'  "tag": {json.dumps(TAG)},\n')
              f.write(f'  "synced_at": {json.dumps(synced_at)},\n')
              f.write(f'  "repo": {json.dumps(REPO)},\n')
              f.write('  "images": [\n')
              for idx, item in enumerate(json_images):
                  comma = "," if idx < len(json_images) - 1 else ""
                  f.write("    " + json.dumps(item, separators=(", ", ": ")) + comma + "\n")
              f.write("  ]\n")
              f.write("}\n")

          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write("changed=true\n")
          PYEOF
          ls -lh ./publish || true

      - name: Create GitHub Release and upload assets
        if: steps.sync.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          body_path: ./release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old LXC releases (keep latest 3)
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("LXC-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName')

          if [ -z "$OLD_TAGS" ]; then
            echo "No old LXC releases to clean up."
            exit 0
          fi

          for tag in $OLD_TAGS; do
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done

      - name: Commit images.json manifest (keeps scheduled workflow active)
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          if git diff --cached --quiet; then
            echo "images.json unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore(sync): update images.json for ${TAG_NAME} [skip ci]"
          git pull --rebase origin main
          git push origin main
